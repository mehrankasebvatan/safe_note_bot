  const gh = '<svg class="w-5 h-5 fill-current text-on-surface" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>';
  return `<div class="bg-surface-container-low p-space-md rounded-xl shadow-md flex flex-col gap-space-sm"><div class="flex items-center gap-space-sm"><div class="relative w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary"><span class="material-symbols-outlined text-[26px]">shield_lock</span><span class="absolute bottom-0 start-0 w-3 h-3 rounded-full bg-secondary shadow-[0_0_8px_#4edea3]"></span></div><div class="flex flex-col"><span class="font-headline-sm text-headline-sm">${tr('sTitle')}</span><span class="font-body-sm text-body-sm text-on-surface-variant">${cloud ? tr('sConn') : tr('sLocal')}</span></div></div><div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant"><span>${tr('sCount', { a: fa(S.notes.length), b: fa(S.tasks.length) })}</span><span>${tr('sKeys', { a: fa(used), b: fa(1024) })}</span></div><div class="w-full h-2 rounded-full bg-surface-container-lowest overflow-hidden"><div class="h-full ${L === 'fa' ? 'bg-gradient-to-l' : 'bg-gradient-to-r'} from-primary via-secondary to-secondary-container rounded-full" style="width:${Math.max(pct, 1)}%"></div></div></div>
<div class="flex flex-col gap-space-sm">${hd('palette', tr('appear'))}<div class="bg-surface-container p-space-md rounded-xl flex flex-col gap-space-xs"><span class="font-label-md text-label-md text-on-surface-variant">${tr('theme')}</span><div class="grid grid-cols-3 gap-space-xs bg-surface-container-lowest p-1 rounded-lg">${[['dark', 'dark_mode'], ['light', 'light_mode'], ['system', 'devices']].map(([k, i]) => `<button data-a="theme" data-id="${k}" class="flex flex-col items-center py-2 rounded-md transition-all ${th === k ? 'bg-surface-container-high text-primary shadow-sm' : 'text-on-surface-variant'}"><span class="material-symbols-outlined text-[20px] mb-0.5">${i}</span><span class="font-label-sm text-label-sm">${tr(k)}</span></button>`).join('')}</div></div><div class="bg-surface-container p-space-md rounded-xl flex flex-col gap-space-xs"><span class="font-label-md text-label-md text-on-surface-variant">${tr('lang')}</span><div class="flex items-center gap-space-sm">${[['fa', 'فا', 'فارسی'], ['en', 'EN', 'English']].map(([k, b, n]) => `<button data-a="lang" data-id="${k}" class="flex-1 flex items-center justify-between p-space-sm rounded-lg transition-colors ${L === k ? 'bg-surface-container-high text-on-surface' : 'bg-surface-container-lowest text-on-surface-variant'}"><div class="flex items-center gap-2"><span class="w-6 h-6 rounded-full ${L === k ? 'bg-secondary-container/30 text-secondary' : 'bg-surface-container-high'} flex items-center justify-center text-[11px] font-medium">${b}</span><span class="font-body-md text-body-md">${n}</span></div><span class="material-symbols-outlined text-[18px] text-secondary ${L === k ? '' : 'opacity-0'}">check_circle</span></button>`).join('')}</div></div></div>
<div class="flex flex-col gap-space-sm">${hd('lock', tr('secH'))}${secBox}</div>
<div class="flex flex-col gap-space-sm">${hd('enhanced_encryption', tr('data'))}<div class="bg-surface-container rounded-xl overflow-hidden flex flex-col">${row('delete_forever', 'text-error', tr('wipeT'), tr('wipeS'), 'wipe')}</div></div>
<div class="flex flex-col gap-space-sm">${hd('info', tr('about'))}<div class="bg-surface-container p-space-md rounded-xl flex flex-col gap-space-sm">${info('cloud', 'text-secondary', 'Telegram CloudStorage', tr('a1d'))}${info('sync', 'text-tertiary', tr('a2t'), tr('a2d'))}</div></div>
<div class="flex flex-col gap-space-sm">${hd('terminal', tr('community'))}${ext(gh, 'bg-surface-container-highest', tr('ghT'), tr('ghS'), 'github', 'GitHub')}${ext('<span class="material-symbols-outlined text-[22px] text-primary-container">send</span>', 'bg-primary-container/20', tr('devT'), tr('devS'), 'dev', esc(LINKS.devName))}</div>
<div class="flex flex-col gap-space-sm">${hd('favorite', tr('supH'), 'text-tertiary')}<div class="bg-surface-container p-space-md rounded-xl flex flex-col gap-space-md shadow-sm"><p class="font-body-sm text-body-sm text-on-surface-variant">${tr('supP')}</p><div class="bg-surface-container-lowest p-space-sm rounded-lg flex flex-col gap-space-xs">${addr('Toncoin (TON)', 'TON', LINKS.tonAddr, 'tonAddr')}<div class="rounded-lg bg-tertiary/10 p-space-sm flex flex-col gap-space-xs"><div class="flex items-center justify-between gap-2"><span class="font-label-md text-label-md text-tertiary">Memo</span><span dir="ltr" class="font-mono text-[14px] text-on-surface select-all">${esc(LINKS.tonMemo)}</span></div><p class="font-label-sm text-label-sm text-tertiary">${tr('memoWarn')}</p><button data-a="copy" data-id="tonMemo" class="flex items-center justify-center gap-2 py-2 rounded-lg bg-surface-container-highest text-on-surface active:scale-[0.98]"><span class="material-symbols-outlined text-[18px] text-tertiary">content_copy</span><span class="font-label-md text-label-md">${tr('copyMemo')}</span></button></div></div><div class="bg-surface-container-lowest p-space-sm rounded-lg flex flex-col gap-space-xs">${addr('USDT (Tether)', 'BSC • BEP20', LINKS.usdt, 'usdt')}<p class="font-label-sm text-label-sm text-tertiary">${tr('netWarn')}</p></div></div></div>
<div class="flex flex-col items-center pt-space-xs pb-space-lg gap-1"><div class="inline-flex items-center gap-1.5 text-on-surface-variant/70 font-label-sm text-label-sm" dir="ltr"><span class="material-symbols-outlined text-[14px]">cloud_done</span>v1.1.0 • ${tg ? esc(tg.platform) + ' ' + esc(tg.version) : 'browser'}</div></div>`;
}

const V = { notes: vNotes, tasks: vTasks, settings: vSettings, editor: vEditor };
function render() {
  const lk = !!(S.ready && S.cfg.lock && !S.unlocked), ed = S.v === 'editor'; document.title = tr('notes');
  $('#app').innerHTML = `<main class="flex-1 flex flex-col w-full pb-28" style="padding-top:calc(env(safe-area-inset-top,0px) + 12px)"><div class="flex flex-col w-full px-space-md ${ed ? 'gap-space-md' : 'gap-space-lg'}">${ed || lk ? '' : pill(S.v !== 'settings')}${lk ? vLock() : S.ready ? V[S.v]() : `<div class="py-24 text-center text-outline">${tr('loading')}</div>`}</div></main>` + (S.v === 'notes' && !lk ? fab : '') + (ed || lk ? '' : nav());
  sync(S.st);
  if (lk) { const i = $('#lpw'); i && i.focus(); }
  const ta = $('textarea'); if (ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
}
function go(v) {
  S.v = v; render(); window.scrollTo(0, 0);
  try { v === 'editor' ? tg.BackButton.show() : tg.BackButton.hide(); } catch (e) {}
}
const newNote = () => ({ id: uid(), title: '', body: '', tags: [], cl: [], pin: false, u: Date.now() });
const tk = id => S.tasks.find(t => t.id === id);
const A = {
  nav: id => { hap(); S.pf = null; go(id); },
  f: id => { S.f = id; render(); },
  tf: id => { S.tf = id; S.draft = ($('#nt') || {}).value || ''; render(); },
  new: () => { hap(); openNote(newNote()); },
  open: id => openNote(S.notes.find(n => n.id === id)),
  back: () => leave(),
  pin: () => { S.cur.pin = !S.cur.pin; hap(); dirty(); render(); },
  del: () => conf(tr('confDel'), () => { const n = S.cur; S.notes = S.notes.filter(x => x !== n); rm('n' + n.id); S.cur = null; hap('medium'); go('notes'); }),
  tagd: id => { S.cur.tags.splice(+id, 1); dirty(); render(); },
  ci: id => { const x = S.cur.cl[+id]; x.d = !x.d; hap(); dirty(); render(); },
  cd: id => { S.cur.cl.splice(+id, 1); dirty(); render(); },
  tt: id => { const t = tk(id); t.d = t.d ? 0 : Date.now(); hap(); saveTasks(); S.draft = ($('#nt') || {}).value || ''; render(); },
  td: id => { S.tasks = S.tasks.filter(t => t.id !== id); saveTasks(); S.draft = ($('#nt') || {}).value || ''; render(); },
  pri: id => { S.pr = id; S.draft = ($('#nt') || {}).value || ''; render(); },
  addt: () => addTask(),
  clr: () => { S.tasks = S.tasks.filter(t => !t.d); saveTasks(); render(); },
  theme: id => { S.cfg.theme = id; try { localStorage.setItem('theme', id); } catch (e) {} applyTheme(); saveCfg(); hap(); render(); },
  link: id => { const u = LINKS[id]; try { id === 'dev' ? tg.openTelegramLink(u) : tg.openLink(u); } catch (e) { window.open(u, '_blank'); } },
  copy: async id => { const v = LINKS[id]; try { await navigator.clipboard.writeText(v); } catch (e) { const t = document.createElement('textarea'); t.value = v; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); } hap(); say(tr(id === 'tonMemo' ? 'copiedMemo' : 'copied')); },
  sync: async () => { hap(); if (S.v === 'tasks') S.draft = ($('#nt') || {}).value || ''; sync('s'); try { await Promise.all(Object.values(Q)); await load(); S.fail = false; S.em = ''; sync('ok'); render(); } catch (e) { S.em = String((e && e.message) || e); sync('err'); } },
  lang: id => { try { localStorage.setItem('lang', id); } catch (e) {} applyLang(id); S.cfg.lang = id; saveCfg(); hap(); render(); },
  wipe: () => conf(tr('confWipe'), wipeAll),
  lockt: () => { S.pf = S.pf ? null : (S.cfg.lock ? 'off' : 'set'); render(); },
  pwchg: () => { S.pf = 'change'; render(); },
  pwcancel: () => { S.pf = null; render(); },
  pwsave: async () => {
    const v = id => (($('#' + id) || {}).value || ''), e = m => { const p = $('#pe'); if (p) p.textContent = m; }, f = S.pf;
    if (!(window.crypto && crypto.subtle)) return e(tr('noCrypto'));
    try {
      if (f !== 'set' && !(await chk(v('pw0')))) return e(tr('wrongPw'));
      if (f === 'off') delete S.cfg.lock;
      else { const a = norm(v('pw1')); if (a.length < 4) return e(tr('pwShort')); if (a !== norm(v('pw2'))) return e(tr('pwMismatch')); S.cfg.lock = await mkLock(a); S.unlocked = true; }
    } catch (x) { return e(String((x && x.message) || x)); }
    S.pf = null; saveCfg(); hap(); render();
  },
  unlock: async () => {
    const i = $('#lpw'), e = $('#le'); if (!i) return;
    try { if (await chk(i.value)) { S.unlocked = true; hap(); render(); return; } } catch (x) { e.textContent = tr('noCrypto'); return; }
    e.textContent = tr('wrongPw'); i.value = ''; hap('medium'); i.focus();
  },
  forgot: () => conf(tr('forgotConf'), wipeAll)
};
function addTask() {
  const el = $('#nt'), v = el.value.trim(); if (!v) return;
  S.tasks.push({ id: uid(), t: v, p: S.pr, d: 0, t0: Date.now() }); S.draft = ''; hap(); saveTasks(); render(); const n = $('#nt'); n && n.focus();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (b && A[b.dataset.a]) A[b.dataset.a](b.dataset.id, b); });
document.addEventListener('input', e => {
  const el = e.target, k = el.dataset.i, n = S.cur; if (!k) return;
  if (k === 'q') { S.q = el.value; $('#list').innerHTML = notesList(); }
  else if (k === 'title') { n.title = el.value; dirty(); }
  else if (k === 'body') { n.body = el.value; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; $('#wc').textContent = stats(n); dirty(); }
  else if (k === 'cit') { n.cl[+el.dataset.id].t = el.value; dirty(); }
  else if (k === 'pw' || k === 'lpw') { const v = norm(el.value); if (v !== el.value) el.value = v; }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return; const el = e.target, k = el.dataset.i, v = el.value.trim();
  if (k === 'nt') addTask();
  else if (k === 'lpw') A.unlock();
  else if (k === 'pw') A.pwsave();
  else if (k === 'tag' && v) { if (!S.cur.tags.includes(v)) S.cur.tags.push(v); dirty(); render(); }
  else if (k === 'addci' && v) { S.cur.cl.push({ t: v, d: 0 }); dirty(); render(); $('#addci').focus(); }
});
try { tg.BackButton.onClick(() => S.v === 'editor' && leave()); } catch (e) {}
document.addEventListener('visibilitychange', async () => { if (!document.hidden && S.ready && S.v !== 'editor') { try { await load(); render(); } catch (e) {} } });

(async () => { render(); try { await load(); } catch (e) { S.fail = true; S.em = String((e && e.message) || e); S.st = 'err'; } S.ready = true; render(); })();
